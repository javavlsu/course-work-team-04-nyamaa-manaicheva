services:
  postgres-db:
    image: postgres:17
    container_name: notesbook-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cursework}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cursework}
      POSTGRES_DB: ${DB_NAME:-notesbook}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cursework} -d ${DB_NAME:-notesbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./automate/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - notesbook-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notesbook-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - notesbook-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notesbook-backend
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-notesbook}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cursework}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cursework}
      SERVER_PORT: ${PORT:-8080}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-notesbook-attachments}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - notesbook-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notesbook-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - notesbook-network

volumes:
  postgres_data:

networks:
  notesbook-network:
    driver: bridge
